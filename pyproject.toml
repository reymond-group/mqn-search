[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mqn-search"
version = "0.1.0"
description = "MQN search and benchmarking tools"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Reymond Group" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
